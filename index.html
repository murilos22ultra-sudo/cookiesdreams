<style>
:root{--bg:#f7eff7;--ink:#442a3c;--lilac:#ead3ee;--line:#e2d0e4;--muted:#8e7989;--green:#557258;--red:#a15f63;--gold:#8a5d42}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}input,select{font-size:16px}.head{position:sticky;top:0;z-index:20;min-height:76px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(105deg,#3f2534,#5b394f,#7c5a7f);color:white}.brand{display:flex;gap:12px;align-items:center}.logo{font-size:27px;padding:10px;border-radius:16px;background:#ffffff18}.brand h1{margin:0;font-family:Georgia,serif}.brand p{margin:2px 0;font-size:12px;color:#e9d9e9}.nav{display:flex;gap:5px}.nav button{min-height:44px;border:0;border-radius:11px;padding:0 13px;background:transparent;color:#fff;font-weight:800}.nav button.on{background:var(--lilac);color:#4c2d41}main{padding:20px}.view{display:none}.view.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 34px #4b2d4012}.pad{padding:20px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stack{display:grid;gap:18px}.metric small{font-weight:900;color:#9b8798}.metric strong{display:block;font-size:27px;margin-top:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.span2{grid-column:span 2}.field label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}.input{width:100%;min-height:48px;border:1px solid #decbe1;border-radius:12px;padding:10px 12px;background:#fffafd}.btn{min-height:46px;border:0;border-radius:12px;padding:0 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(90deg,#67465f,#98709a);color:white}.soft{background:#ece0ee;color:#684963}.danger{background:#fff;border:1px solid #ecd4d4;color:var(--red)}.section{padding:17px 19px;border-bottom:1px solid #eee2ef}.row{padding:15px 19px;border-bottom:1px so </style></head><body><header class="head"><div class="brand"><div class="logo">🍪</div><div><h1>COOKIE DREAM</h1><p>Produção, pedidos e estoque integrados</p></div></div><nav class="nav" id="nav"></nav></header><div id="message" class="message"></div><main>
<section id="dashboard" class="view on"><div class="top"><div><div class="eyebrow">Painel</div><h2>Visão geral da COOKIE DREAM</h2></div><button id="newOrder" class="btn primary">+ Novo pedido</button></div><div id="dashMetrics" class="grid3"></div><div class="grid2" style="margin-top:18px"><div class="card"><div class="section"><h3>Produções disponíveis</h3></div><div id="dashProd"></div></div><div class="card"><div class="section"><h3>Cookies a entregar</h3></div><div id="dashDeliver"></div></div></div><div class="card" style="margin-top:18px"><div class="section"><h3>Pedidos</h3></div><div id="dashOrders"></div></div></section>
<section id="estoque" class="view"><div class="grid2"><form id="stockForm" class="card pad"><h2>Estoque</h2><div class="form"><div class="field span2"><label>Item</label><input id="sName" class="input" required></div><div class="field"><label>Valor pago</label><input id="sValue" class="input" type="number" step=".01" required></div><div class="field"><label>Quantidade</label><input id="sQty" class="input" inputmode="decimal" required></div><div class="field span2"><label>Unidade</label><select id="sUnit" class="input"><option>g</option><option>kg</option><option>ml</option><option>L</option><option>unidade</option></select></div><button class="btn primary span2">Salvar</button></div></form><div class="card"><div class="section"><h3>Estoque disponível</h3></div><div id="stockList"></div></div></div></section>
<section id="producao" class="view"><div class="stack"><form id="prodForm" class="card pad"><h2>PRODUÇÃO</h2><div class="form"><div class="field"><label>Receita</label><input id="pName" class="input" required></div><div class="field"><label>Data</label><input id="pDate" class="input" type="date" required></div><div class="field span2"><label>Cookies produzidos</label><input id="pCookies" class="input" type="number" min="1" required></div></div><div class="top" style="margin-top:14px"><h3>Ingredientes utilizados</h3><button type="button" id="addIng" class="btn soft">+ Incluir item</button></div><div id="ingList"></div><button class="btn primary" style="width:100%;margin-top:14px">Registrar produção</button></form><div id="prodList" class="grid3"></div></div></section>
<section id="pedidos" class="view"><div class="stack"><form id="orderForm" class="card pad"><h2>Novo pedido</h2><div class="form"><div class="field"><label>Cliente</label><input id="oClient" class="input" required></div><div class="field"><label>Data</label><input id="oDate" class="input" type="date" required></div><div class="field"><label>Produção</label><select id="oProd" class="input" required></select></div><div class="field"><label>Quantidade</label><input id="oQty" class="input" type="number" min="1" required></div><div class="field"><label>Valor por cookie</label><input id="oPrice" class="input" type="number" step=".01" required></div><div class="field"><label>Pagamento</label><select id="oPay" class="input"><option>A PAGAR</option><option>PAGO</option></select></div><div class="field span2"><label>Entrega</label><select id="oDelivery" class="input"><option>A ENTREGAR</option><option>ENTREGUE</option><option>CANCELADO</option></select></div><button class="btn primary span2">Salvar pedido</button></div></form><div class="card"><div class="section"><h3>Pedidos cadastrados</h3><div class="order-filter-bar" style="margin-top:12px"><input id="orderSearch" class="input" type="search" placeholder="Buscar por cliente..." autocomplete="off"><select id="orderPayFilter" class="input" aria-label="Filtrar por pagamento"><option value="TODOS">Todos os pagamentos</option><option value="PAGO">PAGO</option><option value="A PAGAR">A PAGAR</option></select></div></div><div id="orderList"></div></div></div></section>
<section id="caixa" class="view"><div id="cashMetrics" class="grid3"></div><div class="grid2" style="margin-top:18px"><form id="cashForm" class="card pad"><h2>Novo lançamento</h2><div class="form"><div class="field"><label>Data</label><input id="cDate" class="input" type="date" required></div><div class="field"><label>Tipo</label><select id="cType" class="input"><option>Entrada</option><option>Saída</option></select></div><div class="field span2"><label>Descrição</label><input id="cDescription" class="input" required></div><div class="field span2"><label>Valor</label><input id="cValue" class="input" type="number" step=".01" required></div><button class="btn primary span2">Salvar lançamento</button></div></form><div class="card"><div class="section"><h3>Movimentações</h3></div><div id="cashList"></div></div></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),N=v=>Number(String(v??'').replace(',','.'))||0,U=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random(),BRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0),today=()=>new Date().toISOString().slice(0,10),date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'';const base=u=>u==='kg'?'g':u==='L'?'ml':u,toBase=(q,u)=>(u==='kg'||u==='L')?N(q)*1000:N(q),fromBase=(q,u)=>(u==='kg'||u==='L')?N(q)/1000:N(q),compatible=(a,b)=>base(a)===base(b),qtxt=(q,u)=>fromBase(q,u).toLocaleString('pt-BR',{maximumFractionDigits:3})+' '+u,load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};const state={tab:'dashboard',stock:load('cd_stock',[]),prod:load('cd_prod',[]),orders:load('cd_orders',[]),cash:load('cd_cash',[]),ings:[],editOrderId:null,orderSearch:'',orderPayFilter:'TODOS'};const save=()=>{localStorage.setItem('cd_stock',JSON.stringify(state.stock));localStorage.setItem('cd_prod',JSON.stringify(state.prod));localStorage.setItem('cd_orders',JSON.stringify(state.orders));localStorage.setItem('cd_cash',JSON.stringify(state.cash))};const tabs=[['dashboard','Visão geral'],['estoque','Estoque'],['producao','Produção'],['pedidos','Pedidos'],['caixa','Fluxo de caixa']];function msg(t){$('message').textContent=t;$('message').classList.add('show');setTimeout(()=>$('message').classList.remove('show'),4000)}function nav(){$('nav').innerHTML=tabs.map(([i,t])=>`<button type="button" data-tab="${i}" class="${state.tab===i?'on':''}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab))}function openTab(id){state.tab=id;document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');nav();render()}const empty=t=>`<div class="empty">${t}</div>`;$('pDate').value=$('oDate').value=$('cDate').value=today();
function orderTotal(o){return N(o.qty)*N(o.price)}function cashForOrder(id){return state.cash.find(x=>x.orderId===id&&x.auto===true)}function syncOrderCash(o){const existing=cashForOrder(o.id);if((o.pay||'A PAGAR')==='PAGO'){const amount=orderTotal(o);if(existing){existing.date=o.date;existing.description='Venda - Pedido de '+o.client;existing.value=amount}else state.cash.unshift({id:U(),date:o.date,type:'Entrada',description:'Venda - Pedido de '+o.client,value:amount,orderId:o.id,auto:true})}else if(existing){state.cash=state.cash.filter(x=>x.id!==existing.id)}}
$('stockForm').onsubmit=e=>{e.preventDefault();const u=$('sUnit').value,b=toBase($('sQty').value,u);state.stock.push({id:U(),name:$('sName').value.trim(),value:$('sValue').value,unit:u,bought:b,remaining:b});e.target.reset();render();msg('Item salvo no estoque.')};function renderStock(){$('stockList').innerHTML=state.stock.map(s=>`<div class="row"><div><h4>${s.name}</h4><p>${BRL(N(s.value))} · disponível ${qtxt(s.remaining,s.unit)}</p></div></div>`).join('')||empty('Nenhum item cadastrado.')}
$('addIng').onclick=()=>{if(!state.stock.length)return msg('Cadastre primeiro um item no estoque.');const s=state.stock.find(x=>N(x.remaining)>0)||state.stock[0];state.ings.push({id:U(),stockId:s.id,amount:'',unit:s.unit});renderIngs()};function renderIngs(){$('ingList').innerHTML=state.ings.map(i=>{const s=state.stock.find(x=>x.id===i.stockId);return`<div class="ingredient"><select class="input" onchange="chgIng('${i.id}','stockId',this.value)">${state.stock.map(x=>`<option value="${x.id}" ${x.id===i.stockId?'selected':''}>${x.name} · ${qtxt(x.remaining,x.unit)}</option>`).join('')}</select><input class="input" inputmode="decimal" value="${i.amount}" oninput="setAmount('${i.id}',this.value)" placeholder="Qtd."><select class="input" onchange="chgIng('${i.id}','unit',this.value)">${['g','kg','ml','L','unidade'].filter(u=>compatible(u,s?s.unit:u)).map(u=>`<option ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select><button class="icon danger" type="button" onclick="rmIng('${i.id}')">×</button></div>`}).join('')}window.setAmount=(id,v)=>{const i=state.ings.find(x=>x.id===id);if(i)i.amount=v};window.chgIng=(id,f,v)=>{state.ings=state.ings.map(i=>i.id!==id?i:f==='stockId'?{...i,stockId:v,unit:state.stock.find(s=>s.id===v).unit}:{...i,[f]:v});renderIngs()};window.rmIng=id=>{state.ings=state.ings.filter(x=>x.id!==id);renderIngs()};$('prodForm').onsubmit=e=>{e.preventDefault();if(!state.ings.length)return msg('Inclua ingredientes.');const totals={};for(const i of state.ings){const s=state.stock.find(x=>x.id===i.stockId),z=toBase(i.amount,i.unit);if(!s||z<=0)return msg('Preencha as quantidades.');totals[s.id]=(totals[s.id]||0)+z}for(const id in totals){const s=state.stock.find(x=>x.id===id);if(totals[id]>N(s.remaining))return msg('Estoque insuficiente para '+s.name)}const cost=state.ings.reduce((a,i)=>{const s=state.stock.find(x=>x.id===i.stockId);return a+toBase(i.amount,i.unit)*(N(s.value)/Math.max(1,N(s.bought)))},0);state.stock=state.stock.map(s=>({...s,remaining:N(s.remaining)-(totals[s.id]||0)}));state.prod.unshift({id:U(),name:$('pName').value.trim(),date:$('pDate').value,produced:N($('pCookies').value),available:N($('pCookies').value),cost,ingredients:JSON.parse(JSON.stringify(state.ings))});state.ings=[];e.target.reset();$('pDate').value=today();render();msg('Produção registrada.')};function renderProd(){$('prodList').innerHTML=state.prod.map(p=>`<article class="card pad"><div style="display:flex;justify-content:space-between"><b>🍪</b><span class="badge paid">${p.available} disponíveis</span></div><h3>${p.name}</h3><p>${date(p.date)} · ${p.produced} produzidos</p><p><b>${BRL(N(p.cost))}</b></p><button class="btn soft" style="width:100%" onclick="toggle('${p.id}')">Ver itens</button><div id="d-${p.id}" class="details">${(p.ingredients||[]).map(i=>`<div class="detail-row"><span>${state.stock.find(s=>s.id===i.stockId)?.name||'Item'}</span><b>${i.amount} ${i.unit}</b></div>`).join('')}</div></article>`).join('')||empty('Nenhuma produção registrada.');$('oProd').innerHTML='<option value="">Selecione</option>'+state.prod.filter(p=>N(p.available)>0).map(p=>`<option value="${p.id}">${p.name} · ${p.available} disponíveis</option>`).join('')}window.toggle=id=>document.getElementById('d-'+id)?.classList.toggle('show');
function reserve(o,d){state.prod=state.prod.map(p=>p.id===o.prodId?{...p,available:N(p.available)+d}:p)}function canReserve(prodId,q){const p=state.prod.find(x=>x.id===prodId);return p&&N(p.available)>=q}window.setDelivery=(id,v)=>{const o=state.orders.find(x=>x.id===id);if(!o)return;const old=o.delivery||'A ENTREGAR';if(old===v)return;if(old!=='CANCELADO'&&v==='CANCELADO'){reserve(o,N(o.qty));o.delivery=v}else if(old==='CANCELADO'&&v!=='CANCELADO'){if(!canReserve(o.prodId,N(o.qty)))return msg('Cookies insuficientes para reativar o pedido.');reserve(o,-N(o.qty));o.delivery=v}else o.delivery=v;render()};window.setPayment=(id,v)=>{const o=state.orders.find(x=>x.id===id);if(!o)return;o.pay=v;syncOrderCash(o);render();msg(v==='PAGO'?'Pedido pago: entrada criada no caixa.':'Pagamento alterado: entrada automática removida do caixa.')};
$('orderForm').onsubmit=e=>{e.preventDefault();const old=state.editOrderId?state.orders.find(x=>x.id===state.editOrderId):null,prodId=$('oProd').value,q=N($('oQty').value),delivery=$('oDelivery').value,p=state.prod.find(x=>x.id===prodId);if(!p||q<=0)return msg('Selecione produção e quantidade.');if(old&&old.delivery!=='CANCELADO')reserve(old,N(old.qty));if(delivery!=='CANCELADO'&&!canReserve(prodId,q)){if(old&&old.delivery!=='CANCELADO')reserve(old,-N(old.qty));return msg('Cookies insuficientes.');}if(delivery!=='CANCELADO')reserve({prodId,qty:q},-q);const o={id:old?old.id:U(),client:$('oClient').value.trim(),date:$('oDate').value,prodId,qty:q,price:N($('oPrice').value),pay:$('oPay').value,delivery};state.orders=old?state.orders.map(x=>x.id===o.id?o:x):[o,...state.orders];syncOrderCash(o);state.editOrderId=null;e.target.reset();$('oDate').value=today();render();msg(old?'Pedido atualizado.':'Pedido salvo.')};function statusHtml(o){return`<span class="badge ${o.pay==='PAGO'?'paid':'unpaid'}">${o.pay||'A PAGAR'}</span> <span class="badge ${o.delivery==='ENTREGUE'?'delivered':o.delivery==='CANCELADO'?'cancelled':'pending'}">${o.delivery||'A ENTREGAR'}</span>`}function orderRow(o){const p=state.prod.find(x=>x.id===o.prodId);return`<div class="row"><div><h4>${o.client}</h4><p>${p?.name||'Produção'} · ${o.qty} cookies · ${BRL(orderTotal(o))}</p>${statusHtml(o)}</div><div class="order-controls"><select class="mini" onchange="setPayment('${o.id}',this.value)"><option ${o.pay!=='PAGO'?'selected':''}>A PAGAR</option><option ${o.pay==='PAGO'?'selected':''}>PAGO</option></select><select class="mini" onchange="setDelivery('${o.id}',this.value)"><option ${o.delivery!=='ENTREGUE'&&o.delivery!=='CANCELADO'?'selected':''}>A ENTREGAR</option><option ${o.delivery==='ENTREGUE'?'selected':''}>ENTREGUE</option><option ${o.delivery==='CANCELADO'?'selected':''}>CANCELADO</option></select><button type="button" class="icon" onclick="editOrder('${o.id}')">✎</button><button type="button" class="icon danger" onclick="deleteOrder('${o.id}')">🗑</button></div></div>`}window.editOrder=id=>{const o=state.orders.find(x=>x.id===id);if(!o)return;state.editOrderId=id;$('oClient').value=o.client;$('oDate').value=o.date;$('oQty').value=o.qty;$('oPrice').value=o.price;$('oPay').value=o.pay||'A PAGAR';$('oDelivery').value=o.delivery||'A ENTREGAR';openTab('pedidos');renderProd();$('oProd').value=o.prodId;window.scrollTo({top:0,behavior:'smooth'});msg('Pedido aberto para edição.');};window.deleteOrder=id=>{const o=state.orders.find(x=>x.id===id);if(!o)return;if(o.delivery!=='CANCELADO')reserve(o,N(o.qty));const cash=cashForOrder(o.id);if(cash)state.cash=state.cash.filter(x=>x.id!==cash.id);state.orders=state.orders.filter(x=>x.id!==id);if(state.editOrderId===id){state.editOrderId=null;$('orderForm').reset();$('oDate').value=today();}render();msg('Pedido excluído. Cookies devolvidos à produção e lançamento automático removido, quando existente.');};function renderOrders(){const term=(state.orderSearch||'').trim().toLocaleLowerCase('pt-BR'),payFilter=state.orderPayFilter||'TODOS',filtered=state.orders.filter(o=>{const byName=!term||String(o.client||'').toLocaleLowerCase('pt-BR').includes(term),byPay=payFilter==='TODOS'||(o.pay||'A PAGAR')===payFilter;return byName&&byPay;});$('orderList').innerHTML=filtered.map(orderRow).join('')||empty(term||payFilter!=='TODOS'?'Nenhum pedido encontrado com os filtros selecionados.':'Nenhum pedido cadastrado.');const search=$('orderSearch'),pay=$('orderPayFilter');if(search){search.value=state.orderSearch;search.oninput=e=>{state.orderSearch=e.target.value;renderOrders();};}if(pay){pay.value=payFilter;pay.onchange=e=>{state.orderPayFilter=e.target.value;renderOrders();};}}
$('newOrder').onclick=()=>{state.editOrderId=null;$('orderForm').reset();$('oDate').value=today();openTab('pedidos')};function renderDash(){const ap=state.prod.filter(p=>N(p.available)>0),ac=state.prod.reduce((s,p)=>s+N(p.available),0),del=state.orders.filter(o=>(o.delivery||'A ENTREGAR')==='A ENTREGAR'),dq=del.reduce((s,o)=>s+N(o.qty),0);$('dashMetrics').innerHTML=[['Produções disponíveis',ap.length],['Cookies disponíveis',ac],['Cookies a entregar',dq]].map(x=>`<div class="card pad metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');$('dashProd').innerHTML=ap.map(p=>`<div class="row"><div><h4>${p.name}</h4><p>${date(p.date)}</p></div><b>${p.available} disponíveis</b></div>`).join('')||empty('Nenhuma produção disponível.');$('dashDeliver').innerHTML=del.map(o=>`<div class="row"><div><h4>${o.client}</h4>${statusHtml(o)}</div><b>${o.qty} cookies</b></div>`).join('')||empty('Nenhum cookie a entregar.');$('dashOrders').innerHTML=state.orders.map(orderRow).join('')||empty('Nenhum pedido cadastrado.')}
$('cashForm').onsubmit=e=>{e.preventDefault();state.cash.unshift({id:U(),date:$('cDate').value,type:$('cType').value,description:$('cDescription').value.trim(),value:N($('cValue').value),auto:false});e.target.reset();$('cDate').value=today();render();msg('Lançamento salvo.')};window.deleteCash=id=>{const x=state.cash.find(c=>c.id===id);if(x?.auto)return msg('Lançamentos automáticos de pedidos devem ser alterados pelo status do pedido.');state.cash=state.cash.filter(c=>c.id!==id);render()};function renderCash(){const income=state.cash.filter(x=>x.type==='Entrada').reduce((s,x)=>s+N(x.value),0),out=state.cash.filter(x=>x.type==='Saída').reduce((s,x)=>s+N(x.value),0);$('cashMetrics').innerHTML=[['Entradas',income,'positive'],['Saídas',out,'negative'],['Saldo',income-out,income-out>=0?'positive':'negative']].map(x=>`<div class="card pad metric"><small>${x[0]}</small><strong class="${x[2]}">${BRL(x[1])}</strong></div>`).join('');$('cashList').innerHTML=state.cash.map(x=>`<div class="row"><div><h4>${x.description}</h4><p>${date(x.date)} · ${x.type}${x.auto?' · automático':''}</p></div><div class="actions"><strong class="${x.type==='Entrada'?'positive':'negative'}">${x.type==='Entrada'?'+':'-'}${BRL(N(x.value))}</strong>${x.auto?'':`<button class="icon danger" onclick="deleteCash('${x.id}')">🗑</button>`}</div></div>`).join('')||empty('Nenhuma movimentação.')}
function migratePaidOrders(){let changed=false;for(const o of state.orders){if((o.pay||'A PAGAR')==='PAGO'&&!cashForOrder(o.id)){syncOrderCash(o);changed=true}}if(changed)save()}function render(){save();nav();renderStock();renderIngs();renderProd();renderOrders();renderDash();renderCash()}migratePaidOrders();render()})();
